name: bibliotech

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      TZ: America/Montevideo
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: bibliotech-app:3.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Montevideo
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - uploads:/var/www/html/carpeta2/uploads
      - movimientos:/var/log/biblioteca

volumes:
  db_data:
  uploads:
  movimientos:
